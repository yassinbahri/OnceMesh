name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip ".[adapters,dev]"
      - run: python -m ruff check src scripts
      - run: python scripts/verify_repository.py
      - run: python scripts/verify_pilot_schemas.py
      - run: python -m coverage run -m unittest discover -s tests -q
      - run: python -m coverage report
      - name: Remove local project before third-party audit
        run: python -m pip uninstall -y oncemesh
      - run: python -m pip_audit --local --skip-editable --strict --progress-spinner off

  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -q

  adapters:
    name: Real adapters / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[adapters]"
      - run: python -m unittest discover -s tests -q
      - run: python evaluation/adapter-platform/run.py
      - run: node conformance/node/run.mjs

  distribution:
    name: Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip ".[dev]"
      - run: python scripts/verify_pilot_schemas.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/verify_distribution.py dist

  docker-federation:
    name: Docker federation acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: python evaluation/federation-sandbox/run.py --report /tmp/federation-ci.json
