name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip ".[dev]"
      - name: Verify tag matches package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/verify_release_tag.py "$RELEASE_TAG"
      - run: python scripts/verify_pilot_schemas.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/verify_distribution.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/oncemesh/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
