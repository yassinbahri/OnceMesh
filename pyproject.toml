[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncemesh"
version = "0.1.0"
description = "Reference implementation of the OnceMesh Action Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "OnceMesh contributors"}]
keywords = ["cache", "agents", "workflows", "content-addressed-storage", "federation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["cryptography>=42,<51", "pypdf>=6.10,<7"]

[project.urls]
Homepage = "https://github.com/yassinbahri/OnceMesh"
Documentation = "https://github.com/yassinbahri/OnceMesh/blob/main/docs/user-guide.md"
Repository = "https://github.com/yassinbahri/OnceMesh.git"
Issues = "https://github.com/yassinbahri/OnceMesh/issues"
Changelog = "https://github.com/yassinbahri/OnceMesh/blob/main/CHANGELOG.md"
Observatory = "https://yassinbahri.github.io/OnceMesh/"

[project.optional-dependencies]
langgraph = ["langgraph>=1.0.10,<2"]
langchain = ["langchain-core>=1.4.7,<2"]
llamaindex = ["llama-index-core>=0.14,<0.15"]
adapters = [
    "langgraph>=1.0.10,<2",
    "langchain-core>=1.4.7,<2",
    "llama-index-core>=0.14,<0.15",
]
dev = [
    "build>=1.3,<2",
    "coverage[toml]>=7.9,<8",
    "jsonschema>=4.23,<5",
    "pip-audit>=2.9,<3",
    "PyYAML>=6.0.2,<7",
    "ruff>=0.12,<1",
    "twine>=6,<8",
]

[project.scripts]
oncemesh-eval = "oncemesh.evaluation:main"
oncemesh-federation = "oncemesh.federation_pilot:main"
oncemesh-pilot = "oncemesh.organization_pilot:main"
oncemesh-discover = "oncemesh.discovery:main"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oncemesh = ["py.typed"]

[tool.coverage.run]
branch = true
source = ["oncemesh"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
